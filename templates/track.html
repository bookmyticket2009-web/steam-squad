{% extends "base.html" %}{% block title %}Track Order · Steam Squad{% endblock %}
{% block content %}<section class="section narrow"><div class="section-head"><h1>TRACK ORDER</h1><a href="{{url_for('home')}}">Menu</a></div><form id="trackForm" class="form-card"><label>Mobile number<input name="phone" inputmode="numeric" pattern="[6-9][0-9]{9}" maxlength="10" required></label><label>Pickup token<input name="token" placeholder="SS-027" required></label><button class="btn primary full">VIEW ORDER</button><p class="muted">We need both your mobile number and token for privacy.</p></form><div id="trackMsg"></div></section>{% endblock %}{% block scripts %}<script src="{{url_for('static',filename='js/app.js')}}"></script><script>document.getElementById('trackForm').addEventListener('submit',async e=>{e.preventDefault();const r=await fetch('/track',{method:'POST',headers:{'Content-Type':'application/json','X-CSRFToken':window.CSRF},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});const d=await r.json();if(d.ok)location=d.redirect;else document.getElementById('trackMsg').textContent=d.message;});</script>{% endblock %}
