{% extends "base.html" %}{% block title %}Checkout · Steam Squad{% endblock %}{% block content %}<section class="section narrow"><span class="eyebrow">CHECKOUT</span><h1>YOUR ORDER</h1><form id="checkoutForm" class="form-card"><label>Name<input name="name" required maxlength="100" autocomplete="name"></label><label>Mobile number<input name="phone" required inputmode="numeric" pattern="[6-9][0-9]{9}" maxlength="10" placeholder="10-digit mobile"></label><label>Special instructions <small>optional</small><textarea name="instructions" maxlength="500" placeholder="Less spicy, etc."></textarea></label><div id="checkoutSummary"></div><button class="btn primary full" type="submit">CONTINUE TO PAYMENT</button><p class="muted center">Pay using the STEAM SQUAD FAM ID shown on the next page.</p></form><div id="checkoutMsg"></div></section>{% endblock %}{% block scripts %}<script src="{{url_for('static',filename='js/checkout.js')}}"></script>{% endblock %}
